name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          # S2-001: the changed-code coverage gate diffs against the PR base branch,
          # so it needs history back to the merge-base.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Same suite as `npm test`, plus coverage data for the changed-code gate.
      - name: Unit tests (with coverage)
        run: npm run test:coverage -- --coverageReporters=json --coverageReporters=text-summary

      - name: Build
        run: npm run build

      # S2-001: fail the PR when added or modified lines are not executed by tests.
      # Policy: scripts/coverage/changed-coverage-policy.ts; docs/changed-code-coverage.md.
      - name: Changed-code coverage
        if: github.event_name == 'pull_request'
        env:
          CHANGED_COVERAGE_BASE: origin/${{ github.base_ref }}
        run: npm run coverage:changed:check

  database:
    name: Database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI container credentials, not a real secret.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Migrations and RLS tests
        run: npm run test:db
